# Logging configuration

# Default log level - WARNING
.level = WARNING

# Console handler configuration
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = [%1$tF %1$tT] [%4$-7s] %5$s %n

# Application-specific loggers - INFO
com.projectlume.level = INFO

# Service layer - WARNING
com.projectlume.service.level = WARNING
com.projectlume.service.BaseService.level = FINE

# DAO layer - WARNING
com.projectlume.dao.level = WARNING

# Controller layer - INFO
com.projectlume.controller.level = INFO

# Servlet layer - INFO
com.projectlume.servlet.level = INFO

# Utility classes - WARNING
com.projectlume.util.level = WARNING
com.projectlume.util.DatabaseConnection.level = INFO
com.projectlume.util.DatabaseStartupListener.level = INFO
com.projectlume.util.DatabaseInitializer.level = INFO

# Filter layer - WARNING
com.projectlume.filter.level = WARNING

# Observer pattern - WARNING
com.projectlume.observer.level = WARNING

# Decorator pattern - WARNING
com.projectlume.decorator.level = WARNING

# Dependency injection - WARNING
com.projectlume.di.level = WARNING

# Tomcat/Catalina - WARNING
org.apache.catalina.level = WARNING
org.apache.coyote.level = WARNING
org.apache.tomcat.level = WARNING

# Maven/Cargo - WARNING
org.codehaus.cargo.level = WARNING

